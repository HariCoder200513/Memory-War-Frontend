name: memory_wars_mobile
description: "Memory Wars - A competitive memory-training mobile game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  google_sign_in: ^6.2.2
  flutter_svg: ^2.0.17
  smooth_page_indicator: ^1.2.0+3
  provider: ^6.1.2
  go_router: ^14.8.1
  email_validator: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
